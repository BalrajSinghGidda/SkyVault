<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SkyVault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <h1 class="logo">☁️ SkyVault</h1>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
      </div>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card">
      <h1>Create Account</h1>
      <form id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
      </form>
      <p>Already have an account? <a href="login.html">Login here</a></p>
      <div id="message" class="message"></div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    // Detect API URL
    const getAPIUrl = () => {
      const hostname = window.location.hostname;
      return `http://${hostname}:5000/api`;
    };
    
    const API_URL = getAPIUrl();
    console.log('📡 API URL:', API_URL);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password }),
        });

        const data = await response.json();
        const messageEl = document.getElementById('message');

        if (response.ok) {
          localStorage.setItem('token', data.token);
          messageEl.textContent = '✅ Registration successful! Redirecting...';
          messageEl.classList.add('success');
          setTimeout(() => window.location.href = 'dashboard.html', 1500);
        } else {
          messageEl.textContent = '❌ ' + (data.error || 'Registration failed');
          messageEl.classList.add('error');
        }
      } catch (error) {
        console.error('Registration error:', error);
        document.getElementById('message').textContent = '❌ Connection error: ' + error.message + '\n\nMake sure backend is running on port 5000';
        document.getElementById('message').classList.add('error');
      }
    });
  </script>
</body>
</html>
