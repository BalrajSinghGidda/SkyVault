<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - SkyVault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <h1 class="logo">☁️ SkyVault</h1>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="#" id="logoutLink">Logout</a>
      </div>
    </div>
  </nav>

  <main class="dashboard">
    <div class="container">
      <h1>Your Dashboard</h1>

      <section class="storage-info">
        <h2>Storage Usage</h2>
        <div id="storageStats" class="stats">
          <p>Loading...</p>
        </div>
      </section>

      <section class="files-section">
        <h2>Your Files</h2>
        <div class="upload-area">
          <input type="file" id="fileInput" />
          <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
            📤 Upload File
          </button>
        </div>
        <div id="filesList" class="files-list">
          <p>Loading files...</p>
        </div>
      </section>

      <section class="activity-section">
        <h2>Recent Activity</h2>
        <div id="activityLog" class="activity-log">
          <p>Loading activity...</p>
        </div>
      </section>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>
    // Detect API URL (supports different ports/hosts)
    const getAPIUrl = () => {
      // Try common backend ports in order
      const backendPorts = [5000, 3001, 8080];
      const hostname = window.location.hostname;
      
      // Return API URL (default to localhost:5000)
      return `http://${hostname}:5000/api`;
    };
    
    const API_URL = getAPIUrl();
    console.log('📡 API URL:', API_URL);

    // Check if user is logged in
    function checkAuth() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'login.html';
      }
    }

    // Logout
    document.getElementById('logoutLink').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('token');
      window.location.href = 'index.html';
    });

    // Get storage stats
    async function loadStorageStats() {
      const token = localStorage.getItem('token');
      try {
        const response = await fetch(`${API_URL}/dashboard/storage`, {
          method: 'GET',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
        });
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        const statsDiv = document.getElementById('storageStats');
        statsDiv.innerHTML = `
          <p>Used: ${(data.totalSize / 1024 / 1024).toFixed(2)} MB / ${(data.maxStorage / 1024 / 1024).toFixed(2)} MB</p>
          <p>Usage: ${data.usedPercentage}%</p>
          <p>Files: ${data.fileCount}</p>
        `;
      } catch (error) {
        console.error('Storage stats error:', error);
        document.getElementById('storageStats').innerHTML = `<p style="color: red;">❌ Error: ${error.message}<br/>Make sure backend is running on port 5000</p>`;
      }
    }

    // Load files
    async function loadFiles() {
      const token = localStorage.getItem('token');
      try {
        const response = await fetch(`${API_URL}/files`, {
          method: 'GET',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
        });
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const files = await response.json();
        const filesList = document.getElementById('filesList');

        if (files.length === 0) {
          filesList.innerHTML = '<p>No files uploaded yet</p>';
          return;
        }

        filesList.innerHTML = files.map(file => `
          <div class="file-item">
            <span>${file.filename}</span>
            <span>${(file.size / 1024 / 1024).toFixed(2)} MB</span>
            <div>
              <a href="${API_URL}/files/${file._id}/download" class="btn btn-small">⬇️ Download</a>
              <button class="btn btn-small btn-danger" onclick="deleteFile('${file._id}')">🗑️ Delete</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Load files error:', error);
        document.getElementById('filesList').innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
      }
    }

    // Upload file
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);

      const token = localStorage.getItem('token');
      try {
        const response = await fetch(`${API_URL}/files/upload`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData,
        });

        if (!response.ok) {
          throw new Error(`Upload failed! status: ${response.status}`);
        }

        alert('✅ File uploaded successfully');
        loadFiles();
        loadStorageStats();
      } catch (error) {
        console.error('Upload error:', error);
        alert('❌ Error: ' + error.message);
      }
    });

    // Delete file
    async function deleteFile(fileId) {
      if (!confirm('Are you sure?')) return;

      const token = localStorage.getItem('token');
      try {
        const response = await fetch(`${API_URL}/files/${fileId}`, {
          method: 'DELETE',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
        });

        if (!response.ok) {
          throw new Error(`Delete failed! status: ${response.status}`);
        }

        loadFiles();
        loadStorageStats();
      } catch (error) {
        console.error('Delete error:', error);
        alert('Error: ' + error.message);
      }
    }

    // Load activity
    async function loadActivity() {
      const token = localStorage.getItem('token');
      try {
        const response = await fetch(`${API_URL}/dashboard/activity`, {
          method: 'GET',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
        });
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const logs = await response.json();
        const activityDiv = document.getElementById('activityLog');

        if (logs.length === 0) {
          activityDiv.innerHTML = '<p>No activity yet</p>';
          return;
        }

        activityDiv.innerHTML = logs.map(log => `
          <div class="activity-item">
            <span>${log.action.toUpperCase()}</span>
            <span>${new Date(log.createdAt).toLocaleString()}</span>
          </div>
        `).join('');
      } catch (error) {
        console.error('Activity error:', error);
        document.getElementById('activityLog').innerHTML = `<p style="color: red;">❌ Error: ${error.message}</p>`;
      }
    }

    // Initialize
    checkAuth();
    loadStorageStats();
    loadFiles();
    loadActivity();
  </script>
</body>
</html>
